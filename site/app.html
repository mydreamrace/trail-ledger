<title>Patrick's Trail Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: map hero, then a slim "today" line, races, records (tabbed), training (one chart), recent.
   Few boxes: sections are separated by space and a single rule, not borders on everything. */
:root{
  --bg:#eef1ec; --surface:#f8faf6; --ink:#17201b; --muted:#5d6a62; --line:#d3dbd3;
  --accent:#0f8a8a; --accent-soft:#cfe9e6; --pb:#e0a100; --pb-ink:#7a5600;
  --ok:#2f7d32; --ok-soft:#dcefd9; --bad:#b3261e; --bad-soft:#f6dcd9;
  --go:#22a35a; --warn:#e3a008; --stop:#d63b30; --lamp-off:#d5ddd6; --lamp-case:#1c2420;
  --map-bg:#0e1714; --map-contour:rgba(150,190,170,.10); --map-ink:#e7efe9; --map-run:#46e0c8; --map-ride:#7eaaff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18201c; --ink:#e6ede8; --muted:#94a39a; --line:#2a3530;
  --accent:#3cc9bb; --accent-soft:#173b37; --pb:#f2be3a; --pb-ink:#f2be3a;
  --ok:#7fcf84; --ok-soft:#1d3a20; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --go:#3fd07a; --warn:#f5c33b; --stop:#ff6b5e; --lamp-off:#2b3530; --lamp-case:#0c1210; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201c; --ink:#e6ede8; --muted:#94a39a; --line:#2a3530;
  --accent:#3cc9bb; --accent-soft:#173b37; --pb:#f2be3a; --pb-ink:#f2be3a;
  --ok:#7fcf84; --ok-soft:#1d3a20; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --go:#3fd07a; --warn:#f5c33b; --stop:#ff6b5e; --lamp-off:#2b3530; --lamp-case:#0c1210; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:52px}
.num{font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:.95;text-wrap:balance}
h2{font-size:clamp(26px,3.4vw,34px);font-weight:800}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.status{font-size:14px;color:var(--muted);padding:40px 0;text-align:center}
.sample{font-size:13px;color:var(--muted);border:1px dashed var(--line);padding:8px 12px;border-radius:6px}

/* header + map */
.top{display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
header h1{font-size:clamp(40px,6.5vw,72px);font-weight:900}
header h1 span{color:var(--accent)}
.sync{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.hero{position:relative;background:var(--map-bg);color:var(--map-ink);border-radius:10px;overflow:hidden;height:clamp(260px,30vw,360px);max-width:100%}
.hero #map{position:absolute;inset:0;background:var(--map-bg)}
.hero .leaflet-container{font-family:var(--body);background:var(--map-bg)}
.hero .leaflet-control-attribution{background:rgba(14,23,20,.7);color:#9fb3a8;font-size:10.5px}
.hero .leaflet-control-attribution a{color:#cfe0d6}
.hero .leaflet-control-zoom a{background:rgba(14,23,20,.85);color:var(--map-ink);border-color:rgba(255,255,255,.18)}
.heat-canvas{position:absolute;top:0;left:0;pointer-events:none}
.hero-overlay{position:absolute;z-index:800;left:0;right:0;bottom:0;padding:16px 20px;display:flex;justify-content:flex-end;align-items:end;pointer-events:none;
  background:linear-gradient(to top,rgba(14,23,20,.9),rgba(14,23,20,0))}
.totals{display:flex;gap:26px;flex-wrap:wrap}
.totals div{display:flex;flex-direction:column}
.totals strong{font-family:var(--display);font-size:clamp(28px,3.6vw,40px);font-weight:800;line-height:1}
.totals span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.map-ctl{position:absolute;z-index:900;top:14px;left:16px;display:flex;gap:6px;flex-wrap:wrap}
.map-ctl button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.08);color:var(--map-ink);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;cursor:pointer}
.map-ctl button[aria-pressed="true"]{background:var(--map-run);color:#062320;border-color:var(--map-run)}

/* today line */
.today{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;padding-block:4px}
.today > div + div{border-left:1px solid var(--line);padding-left:28px}
.form{display:flex;align-items:center;gap:12px}
.form strong{font-family:var(--display);font-size:46px;font-weight:800;line-height:.9}
.form .meta{display:flex;flex-direction:column;gap:4px}
.chip{align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.optimal{background:var(--ok-soft);color:var(--ok)} .chip.high-risk{background:var(--bad-soft);color:var(--bad)} .chip.neutral{background:var(--line);color:var(--ink)}
.small{font-size:12.5px;color:var(--muted)}
.focus p{margin:4px 0 0;font-size:15px}
.wx{display:flex;align-items:center;gap:12px;text-align:right}
.wx strong{font-family:var(--display);font-size:46px;font-weight:800;line-height:.9}
.wx b{color:var(--accent);font-weight:600}
@media (max-width:820px){.today{grid-template-columns:1fr;gap:16px}.today > div + div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}.wx{text-align:left}}

/* races */
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.race{background:var(--surface);border-radius:10px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.race h3{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;margin:0;line-height:1}
.race .where{font-size:12.5px;color:var(--muted)}
.race-mid{display:flex;justify-content:space-between;align-items:center;gap:10px}
.days{font-family:var(--display);font-size:52px;font-weight:900;line-height:.85;color:var(--accent)}
.days small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.light{display:flex;flex-direction:column;align-items:center;gap:5px}
.lamps{display:flex;gap:5px;padding:5px 7px;border-radius:999px;background:var(--lamp-case)}
.lamps i{width:13px;height:13px;border-radius:50%;background:var(--lamp-off)}
.light.red .lamps i:nth-child(1){background:var(--stop);box-shadow:0 0 8px var(--stop)}
.light.yellow .lamps i:nth-child(2){background:var(--warn);box-shadow:0 0 8px var(--warn)}
.light.green .lamps i:nth-child(3){background:var(--go);box-shadow:0 0 8px var(--go)}
.light span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.light.red span{color:var(--stop)} .light.yellow span{color:var(--warn)} .light.green span{color:var(--go)}
.rb{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.rb-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:4px}
.rb-top span{color:var(--muted);white-space:nowrap}
.rb-track{position:relative;height:6px;background:var(--line);border-radius:4px}
.rb-track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.green .rb-track i{background:var(--go)} .yellow .rb-track i{background:var(--warn)} .red .rb-track i{background:var(--stop)}
.rb-track u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.45;border-radius:1px}
.note{margin-top:12px;font-size:12px;color:var(--muted)}

/* segmented switches */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface)}
.seg button{font:500 12.5px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}

/* records */
.recs{overflow-x:auto}
.rec-grid{display:grid;gap:18px 16px;align-items:start;min-width:max-content}
.rec-grid .rowlbl{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;line-height:1;padding-top:16px}
.rec-grid .rowlbl.yr{color:var(--accent)}
.rec-grid .sep{grid-column:1 / -1;height:1px;background:var(--line)}
.rec{display:flex;flex-direction:column;gap:2px;min-width:0}
.rec .v{font-family:var(--display);font-size:32px;font-weight:800;line-height:1.05;white-space:nowrap}
.rec .w{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec.gold .v{color:var(--pb-ink)} .rec.empty .v{color:var(--line)}

/* training */
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:18px}
.stats strong{font-family:var(--display);font-size:28px;font-weight:800;display:block;line-height:1}
.stats span{font-size:12px;color:var(--muted)}

/* recent */
.log{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:64px minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row svg{width:64px;height:40px;display:block}
.row .name{font-weight:600}
.row .when{font-size:12.5px;color:var(--muted)}
.row .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.row .v{font-weight:600}
.sport{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
@media (max-width:640px){.row{grid-template-columns:56px minmax(0,1fr) minmax(0,1fr)}.row .title{grid-column:2 / -1}.row svg{grid-row:span 2;width:56px}.row .c-pace{display:none}}
footer{font-size:12.5px;color:var(--muted);text-align:center}
footer a{color:inherit}
</style>
<!--body-->
<div class="wrap" id="app">
  <div class="status" id="status">Loading your training data…</div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("en-CA");
const MONO = "IBM Plex Mono,monospace";

function decode(str){ // Google encoded polyline
  const pts=[];let i=0,lat=0,lng=0;
  while(i<str.length){
    for(const k of [0,1]){let b,shift=0,res=0;
      do{b=str.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);
      const d=(res&1)?~(res>>1):(res>>1); if(k===0)lat+=d; else lng+=d}
    pts.push([lat/1e5,lng/1e5]);
  }
  return pts;
}
function hms(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`}
function pace(a){
  if(!a.dist_m||!a.moving_s)return "n/a";
  if(a.cat==="run"||a.cat==="other"){const s=a.moving_s/(a.dist_m/1000);return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")} /km`}
  if(a.cat==="ride")return `${(a.dist_m/a.moving_s*3.6).toFixed(1)} km/h`;
  const s=a.moving_s/(a.dist_m/100);return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")} /100m`;
}
const km = m => m>=100000?`${nf.format(Math.round(m/1000))} km`:`${(m/1000).toFixed(1)} km`;
const dateFmt = (iso,opt) => new Date(iso.length===10?iso+"T12:00":iso).toLocaleDateString("en-CA",opt);
const SPORT = {Run:"Run",TrailRun:"Trail run",Ride:"Ride",VirtualRide:"Virtual ride",GravelRide:"Gravel ride",MountainBikeRide:"MTB",Swim:"Swim",OpenWaterSwim:"Open water",Hike:"Hike",Walk:"Walk"};

let D=null, recSport="run", chartMode="hours";

async function main(){
  try{
    const r = await fetch("data/stats.json",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    D = await r.json();
  }catch(e){
    $("#status").textContent = "Couldn't load data/stats.json. Run the build, then reload.";
    return;
  }
  render();
}

const LIGHT={green:"On track",yellow:"Needs work",red:"Not ready"};
const fmtU=(v,u)=>u==="m"?`${nf.format(Math.round(v))} m`:u==="h"?`${(+v).toFixed(1)} h`:u==="km"?`${Math.round(v)} km`:(+v).toFixed(1).replace(/\.0$/,"");

function render(){
  const d=D, t=d.totals, now=new Date();
  const goals=(d.goals||[]).map(g=>({...g,days:Math.ceil((new Date(g.date+"T08:00")-now)/864e5)})).filter(g=>g.days>=0).sort((a,b)=>a.days-b.days);
  const f=d.fitness, fo=d.focus, h=f&&f.health||{};
  const healthBits=[h.rhr&&`Resting HR ${Math.round(h.rhr.value)}`, h.hrv&&`HRV ${Math.round(h.hrv.value)}`, h.sleep_s&&`Sleep ${(h.sleep_s.value/3600).toFixed(1)} h`].filter(Boolean).join(" · ");

  $("#app").innerHTML = `
  ${d.sample?`<div class="sample">Sample data for testing. Your Intervals.icu history replaces it on the first nightly run.</div>`:""}
  <div class="top">
    <header>
      <h1>${esc(d.athlete)}'s <span>${esc(d.title)}</span></h1>
      <div class="sync num">Updated ${new Date(d.generated).toLocaleString("en-CA",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}<br>${nf.format(d.count_all)} activities</div>
    </header>
    <section class="hero" aria-label="Route heatmap">
      <div id="map" aria-label="Map of every run and ride. Drag to pan, scroll or pinch to zoom."></div>
      <div class="map-ctl" role="group" aria-label="Filter routes">
        <button type="button" id="f-all" data-f="all" aria-pressed="true">All</button>
        <button type="button" id="f-run" data-f="run" aria-pressed="false">Run</button>
        <button type="button" id="f-ride" data-f="ride" aria-pressed="false">Ride</button>
      </div>
      <div class="hero-overlay"><div class="totals num">
        <div><strong>${nf.format(t.km)}</strong><span>km in ${t.year}</span></div>
        <div><strong>${nf.format(t.elev_m)}</strong><span>m climbed</span></div>
        <div><strong>${nf.format(t.hours)}</strong><span>hours</span></div>
      </div></div>
    </section>
  </div>

  <section class="today" aria-label="Today">
    ${f?`<div class="form"><strong class="num">${f.form>0?"+":""}${f.form}</strong><div class="meta"><span class="lbl">Form</span><span class="chip ${f.zone.toLowerCase().replace(/\s+/g,"-")}">${esc(f.zone)}</span></div></div>`:"<div></div>"}
    <div class="focus">${fo?`<span class="lbl">${esc(fo.phase)} phase · ${esc(fo.race)}, ${fo.weeks} weeks</span><p>${esc(fo.tips[0]||fo.summary)}</p>${healthBits?`<div class="small num" style="margin-top:4px">${healthBits}</div>`:""}`:""}</div>
    <div class="wx" id="wx">${d.weather?`<span class="small">Loading weather…</span>`:""}</div>
  </section>

  ${goals.length?`<section>
    <div class="sec-head"><h2>Races</h2></div>
    <div class="races">${goals.map(g=>`
      <article class="race">
        <div><h3>${esc(g.name)}</h3><div class="where">${esc(g.where)} · ${g.date_confirmed?dateFmt(g.date,{month:"short",day:"numeric",year:"numeric"}):"≈ "+dateFmt(g.date,{month:"short",year:"numeric"})}</div></div>
        <div class="race-mid"><div class="days num">${g.days}<small>days</small></div>${g.light?`<div class="light ${g.light}" title="${Math.round(g.score*100)}% of where you should be by now"><div class="lamps" aria-hidden="true"><i></i><i></i><i></i></div><span>${LIGHT[g.light]}</span></div>`:""}</div>
        ${(g.readiness||[]).length?`<div class="rb">${g.readiness.map(b=>{
          const fill=Math.max(2,Math.min(100,b.current/b.target*100)), mark=Math.min(100,b.expected/b.target*100);
          return `<div class="${b.status}" title="${LIGHT[b.status]}: about ${fmtU(b.expected,b.unit)} expected by now"><div class="rb-top"><span style="color:var(--ink)">${esc(b.label)}</span><span class="num">${fmtU(b.current,b.unit)} / ${fmtU(b.target,b.unit)}</span></div><div class="rb-track"><i style="width:${fill.toFixed(1)}%"></i><u style="left:${mark.toFixed(1)}%"></u></div></div>`}).join("")}</div>`:""}
      </article>`).join("")}</div>
    <div class="note">Last 4 weeks against race-day targets. The tick marks where you should be by now.</div>
  </section>`:""}

  <section>
    <div class="sec-head"><h2>Records</h2>
      <div class="ctrls">
        <div class="seg" role="group" aria-label="Sport">${[["run","Running"],["ride","Biking"],["swim","Swimming"]].map(([k,l])=>`<button type="button" id="rs-${k}" data-rs="${k}" aria-pressed="${recSport===k}">${l}</button>`).join("")}</div>
      </div>
    </div>
    <div class="recs" id="recs"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Training</h2>
      <div class="seg" role="group" aria-label="Chart"><button type="button" id="cm-hours" data-cm="hours" aria-pressed="${chartMode==="hours"}">Weekly hours</button><button type="button" id="cm-km" data-cm="km" aria-pressed="${chartMode==="km"}">Running km</button></div>
    </div>
    <div class="chart" id="chart"></div>
    <div id="legend"></div>
    <div class="stats num" id="stats"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Recent</h2></div>
    <div class="log">${d.recent.slice(0,5).map(a=>`<div class="row">${mini(a.route)}
      <div class="title"><span class="sport">${esc(SPORT[a.type]||a.type)}</span><div class="name">${esc(a.name)}</div><div class="when">${new Date(a.start).toLocaleString("en-CA",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</div></div>
      <div><span class="k">Distance</span><span class="v num">${km(a.dist_m)}</span></div>
      <div><span class="k">Time</span><span class="v num">${hms(a.moving_s)}</span></div>
      <div class="c-pace"><span class="k">${a.cat==="ride"?"Speed":"Pace"}</span><span class="v num">${pace(a)}</span></div></div>`).join("")}</div>
  </section>

  <footer>Built nightly from Coros via Intervals.icu · routes near home are hidden · <a href="wall.html">Wall view</a></footer>`;

  document.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{recSport=b.dataset.rs;setPressed("[data-rs]",b);drawRecs()});
  document.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{chartMode=b.dataset.cm;setPressed("[data-cm]",b);drawTraining()});
  drawRecs(); drawTraining();
  if(d.weather) loadWeather(d.weather);
  heatmap(d.heat);
}
function setPressed(sel,on){document.querySelectorAll(sel).forEach(o=>o.setAttribute("aria-pressed",String(o===on)))}

const SHORT={"Longest run":"Long run","Biggest climb":"Climb","Longest ride":"Long ride","Longest swim":"Long swim"};
function drawRecs(){
  const d=D, yr=String(d.totals.year), A=d.pbs||[], Y=d.pbs_year||[];
  const tile=(label,val,sub,cls="",tip="")=>`<div class="rec ${cls}"${tip?` title="${esc(tip)}"`:""}><span class="lbl">${esc(label)}</span><span class="v num">${val}</span><span class="w">${sub||"&nbsp;"}</span></div>`;
  const blank=label=>tile(label,"–","","empty");
  const fromPb=(p,label,isYear)=>{
    if(!p||p.value==null) return blank(label);
    const v=p.unit==="time"?hms(p.value):(p.unit==="elev"||p.unit==="swim")?`${nf.format(Math.round(p.value))} m`:`${nf.format(Math.round(p.value/1000))} km`;
    return tile(label,v,dateFmt(p.date,isYear?{month:"short",day:"numeric"}:{month:"short",year:"numeric"}),isYear&&p.is_pb?"gold":"",p.name+(isYear&&p.is_pb?" · all-time best":""));
  };
  const pbCol=(name,label)=>({all:fromPb(A.find(p=>p.label===name),label,false),year:fromPb(Y.find(p=>p.label===name),label,true)});
  let cols=[];
  if(recSport==="run") cols=[["5K","5K"],["10K","10K"],["Half","Half"],["Marathon","Marathon"],["50K","50K"],["100K","100K"],["Longest run","Long run"],["Biggest climb","Climb"]].map(([n,l])=>pbCol(n,l));
  if(recSport==="ride"){
    const p=d.power;
    if(p) cols=Object.keys(p.all).map(k=>{const a=p.all[k], y=p.year&&p.year[k];
      const gold=y&&a&&y.watts===a.watts&&y.date===a.date;
      return {all:a?tile(k,`${a.watts} W`,dateFmt(a.date,{month:"short",year:"numeric"}),"",a.name):blank(k),
              year:y?tile(k,`${y.watts} W`,dateFmt(y.date,{month:"short",day:"numeric"}),gold?"gold":"",y.name+(gold?" · all-time best":"")):blank(k)}});
    cols.push(pbCol("Longest ride","Long ride"));
    if(p) cols.push({all:tile("FTP est.",p.eftp?`${p.eftp} W`:"–","last 90 days","","95% of your best 20 minutes in the last 90 days"),year:""});
    if(p&&p.wkg) cols.push({all:tile("W/kg",p.wkg,"at FTP"),year:""});
    if(p&&p.zwift_cat) cols.push({all:tile("Zwift",`Cat ${esc(p.zwift_cat)}`,"racing"),year:""});
  }
  if(recSport==="swim") cols=[pbCol("Longest swim","Long swim")];
  const n=Math.max(cols.length,6);
  $("#recs").innerHTML=`<div class="rec-grid" style="grid-template-columns:90px repeat(${n},minmax(104px,1fr))">
    <div class="rowlbl">All time</div>${cols.map(c=>c.all).join("")}${"<div></div>".repeat(n-cols.length)}
    <div class="sep"></div>
    <div class="rowlbl yr">${yr}</div>${cols.map(c=>c.year||"<div></div>").join("")}${"<div></div>".repeat(n-cols.length)}
  </div>`;
}

function drawTraining(){
  const d=D;
  if(chartMode==="hours"){
    weeklyChart(d.weekly,"#chart");
    $("#legend").innerHTML=`<div class="legend"><span><i style="background:var(--accent)"></i>Run</span><span><i style="background:var(--muted);opacity:.55"></i>Ride</span><span><i style="background:var(--pb)"></i>Swim</span><span><i style="background:var(--line)"></i>Other</span></div>`;
    const tot=d.weekly.map(w=>w.run+w.ride+w.swim+w.other), now=tot[tot.length-1]||0, avg=tot.slice(-4).reduce((a,b)=>a+b,0)/Math.max(1,Math.min(4,tot.length));
    $("#stats").innerHTML=`<div><strong>${now.toFixed(1)} h</strong><span>this week</span></div><div><strong>${avg.toFixed(1)} h</strong><span>4-week average</span></div><div><strong>${Math.max(0,...tot).toFixed(1)} h</strong><span>biggest week, last 16</span></div>`;
  }else{
    yoyChart(d.yoy,"#chart");
    $("#legend").innerHTML=`<div class="legend"><span><i style="background:var(--accent)"></i>${d.yoy.this_year}</span><span><i style="background:var(--muted)"></i>${d.yoy.last_year}</span></div>`;
    const v=d.streaks.vs_last_pct;
    $("#stats").innerHTML=`<div><strong>${nf.format(d.yoy.this[d.yoy.this.length-1]||0)} km</strong><span>run so far in ${d.yoy.this_year}</span></div><div><strong>${v==null?"n/a":(v>0?"+":"")+v+"%"}</strong><span>vs ${d.yoy.last_year} to date</span></div><div><strong>${d.streaks.run_streak}</strong><span>day run streak</span></div>`;
  }
}

const WMO={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",
  77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"};
async function loadWeather(w){
  const box=$("#wx"); if(!box) return;
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lng}&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=1`);
    if(!r.ok) throw new Error(r.status);
    const x=await r.json(), c=x.current, h=x.hourly, dl=x.daily;
    const nowH=new Date(c.time).getHours(), sr=new Date(dl.sunrise[0]).getHours(), ss=new Date(dl.sunset[0]).getHours()+1;
    let best=null;
    for(let i=Math.max(nowH,sr);i<Math.min(ss,23);i++){
      const rain=Math.max(h.precipitation_probability[i]??100,h.precipitation_probability[i+1]??100), tp=(h.temperature_2m[i]+h.temperature_2m[i+1])/2, sc=rain+Math.abs(tp-10)*1.5;
      if(!best||sc<best.sc) best={i,rain,sc};
    }
    const hr=n=>new Date(2000,0,1,n).toLocaleTimeString("en-CA",{hour:"numeric"});
    box.innerHTML=`<div><span class="lbl">${esc(w.place)}</span><div class="small">${esc(WMO[c.weather_code]||"")} · H ${Math.round(dl.temperature_2m_max[0])}° L ${Math.round(dl.temperature_2m_min[0])}°</div><div class="small">${best?`Best time out: <b>${hr(best.i)} to ${hr(best.i+2)}</b>, ${best.rain}% rain`:"Daylight is done for today"}</div></div><strong class="num">${Math.round(c.temperature_2m)}°</strong>`;
  }catch(e){ box.innerHTML=`<span class="small">Forecast unavailable right now</span>`; }
}

function mini(route){
  const segs=(route||[]).map(decode);
  const pts=segs.flat();
  if(pts.length<2) return `<svg viewBox="0 0 64 40" aria-hidden="true"><rect width="64" height="40" rx="4" fill="var(--accent-soft)"/><line x1="16" y1="20" x2="48" y2="20" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="3 4" stroke-linecap="round"/></svg>`;
  const lat0=pts[0][0]*Math.PI/180, xs=pts.map(p=>p[1]*Math.cos(lat0)), ys=pts.map(p=>-p[0]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min(52/((maxx-minx)||1e-9),30/((maxy-miny)||1e-9)), ox=(64-(maxx-minx)*s)/2, oy=(40-(maxy-miny)*s)/2;
  const path=segs.map(seg=>seg.map((p,i)=>(i?"L":"M")+((p[1]*Math.cos(lat0)-minx)*s+ox).toFixed(1)+" "+((-p[0]-miny)*s+oy).toFixed(1)).join("")).join("");
  return `<svg viewBox="0 0 64 40" aria-hidden="true"><rect width="64" height="40" rx="4" fill="var(--accent-soft)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function niceMax(v,step){return Math.max(step,Math.ceil(v/step)*step)}
function weeklyChart(weeks,sel="#weekly"){
  const W=1000,H=230,L=36,B=24,T=8,R=8,n=weeks.length;
  const tot=weeks.map(w=>w.run+w.ride+w.swim+w.other), max=niceMax(Math.max(...tot,1),4), step=max/4;
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly training hours for the last 16 weeks">`;
  for(let v=0;v<=max+1e-9;v+=step) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="${MONO}">${Math.round(v)}h</text>`;
  weeks.forEach((w,i)=>{const x=L+i*bw+bw*.15, bwi=bw*.7; let acc=0;
    [["run","var(--accent)",1],["ride","var(--muted)",.55],["swim","var(--pb)",1],["other","var(--line)",1]].forEach(([k,c,o])=>{const v=w[k]; if(!v)return;
      s+=`<rect x="${x.toFixed(1)}" y="${y(acc+v).toFixed(1)}" width="${bwi.toFixed(1)}" height="${(y(acc)-y(acc+v)).toFixed(1)}" fill="${c}" opacity="${o}"><title>${dateFmt(w.start,{month:"short",day:"numeric"})}: ${k} ${v.toFixed(1)} h</title></rect>`; acc+=v});
    if(i%4===0||i===n-1) s+=`<text x="${(x+bwi/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="${MONO}">${dateFmt(w.start,{month:"short",day:"numeric"})}</text>`;
  });
  $(sel).innerHTML=s+"</svg>";
}

function yoyChart(d,sel="#yoy"){
  const W=1000,H=230,L=48,B=24,T=18,R=14;
  const max=niceMax(Math.max(...d.this,...d.last,1),500), step=max/4;
  const x=i=>L+(W-L-R)*i/11, y=v=>T+(H-T-B)*(1-v/max);
  const path=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative running kilometres, ${d.this_year} against ${d.last_year}">`;
  for(let v=0;v<=max+1e-9;v+=step) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="${MONO}">${nf.format(Math.round(v))}</text>`;
  "JFMAMJJASOND".split("").forEach((m,i)=>s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="${MONO}">${m}</text>`);
  if(d.last.length) s+=`<path d="${path(d.last)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>`;
  if(d.this.length){const n=d.this.length-1,last=d.this[n];
    s+=`<path d="${path(d.this)} L${x(n)} ${y(0)} L${x(0)} ${y(0)} Z" fill="var(--accent)" opacity=".12"/><path d="${path(d.this)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    s+=`<circle cx="${x(n)}" cy="${y(last)}" r="4.5" fill="var(--accent)"/><text x="${x(n)+(n>7?-8:8)}" y="${y(last)-10}" text-anchor="${n>7?"end":"start"}" font-size="12" font-weight="600" fill="var(--ink)" font-family="${MONO}">${nf.format(last)} km</text>`}
  $(sel).innerHTML=s+"</svg>";
}

function heatmap(h){
  const el=$("#map");
  if(!window.L){ // map library blocked or offline: plain dark panel, routes still drawn below
    el.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;color:#9fb3a8;font-size:13px">Map tiles unavailable here</div>';
    return;
  }
  const routes=h.routes.map(r=>({c:r.c,y:r.y,segs:r.p.map(decode)}));
  const map=L.map(el,{zoomControl:false,attributionControl:true,preferCanvas:true,worldCopyJump:false,minZoom:3,maxZoom:17});
  L.control.zoom({position:"topright"}).addTo(map);
  // Dark basemap so the routes glow. Esri's dark gray canvas is free for personal, non-commercial use without a key.
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{
    maxNativeZoom:16,maxZoom:17,
    attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
  }).addTo(map);
  const dLat=h.radius_km/110.57, dLng=h.radius_km/(111.32*Math.cos(h.center[0]*Math.PI/180));
  map.fitBounds([[h.center[0]-dLat*.6,h.center[1]-dLng*.6],[h.center[0]+dLat*.6,h.center[1]+dLng*.6]]);

  // Custom canvas layer: additive blending makes well-worn routes glow brighter, like a real heatmap
  let sport="all", year="all";
  const HeatLayer=L.Layer.extend({
    onAdd(m){
      this._c=L.DomUtil.create("canvas","heat-canvas");
      m.getPanes().overlayPane.appendChild(this._c);
      m.on("moveend zoomend resize viewreset",this._draw,this);
      m.on("zoomanim",this._hide,this);
      this._draw();
    },
    onRemove(m){this._c.remove(); m.off("moveend zoomend resize viewreset",this._draw,this); m.off("zoomanim",this._hide,this)},
    _hide(){this._c.style.opacity=0},
    _draw(){
      const m=this._map, size=m.getSize(), dpr=devicePixelRatio||1, c=this._c, cx=c.getContext("2d");
      L.DomUtil.setPosition(c,m.containerPointToLayerPoint([0,0]));
      c.width=size.x*dpr; c.height=size.y*dpr; c.style.width=size.x+"px"; c.style.height=size.y+"px"; c.style.opacity=1;
      cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,size.x,size.y);
      const z=m.getZoom(), bounds=m.getBounds().pad(.2);
      const shown=routes.filter(r=>(sport==="all"||r.c===sport)&&(year==="all"||String(r.y)===year));
      const alpha=Math.max(.12,Math.min(.6,7/Math.sqrt(shown.length+1)))*(z>=14?1.3:1);
      cx.globalCompositeOperation="lighter"; cx.lineCap="round"; cx.lineJoin="round";
      cx.lineWidth=z>=15?3:z>=13?2.2:1.6;
      const run=css("--map-run"), ride=css("--map-ride");
      for(const rt of shown){
        cx.strokeStyle=rt.c==="ride"?ride:run; cx.globalAlpha=Math.min(1,alpha);
        cx.beginPath();
        for(const seg of rt.segs){
          if(!seg.some(p=>bounds.contains(p))) continue;
          seg.forEach((p,i)=>{const q=m.latLngToContainerPoint(p); i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y)});
        }
        cx.stroke();
      }
      cx.globalAlpha=1; cx.globalCompositeOperation="source-over";
    }
  });
  const heat=new HeatLayer().addTo(map);
  const press=(sel,attr,set)=>document.querySelectorAll(sel).forEach(b=>b.addEventListener("click",()=>{
    set(b.dataset[attr]); document.querySelectorAll(sel).forEach(o=>o.setAttribute("aria-pressed",String(o===b))); heat._draw()}));
  press("[data-f]","f",v=>sport=v);
  new ResizeObserver(()=>map.invalidateSize()).observe(el);
}

main();
</script>
